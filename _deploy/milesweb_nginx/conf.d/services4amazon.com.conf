# services4amazon.com — restore after Workroom accidentally became default_server.
# Adjust root if CyberPanel docroot differs (check: ls /home/services4amazon.com/public_html)
server {
    listen 80;
    listen [::]:80;
    server_name services4amazon.com www.services4amazon.com;

    root /home/services4amazon.com/public_html;
    index index.php index.html index.htm;
    client_max_body_size 128M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300;
        fastcgi_pass unix:/run/php-fpm/www.sock;
    }
}

