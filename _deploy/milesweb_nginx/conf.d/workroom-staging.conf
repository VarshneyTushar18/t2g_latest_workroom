# Workroom staging ONLY — do not use default_server (keeps other domains on conf.d vhosts).
server {
    listen 80;
    listen [::]:80;
    server_name 103.174.102.70 workroom-stage.example.com;

    root /var/www/workroom;
    index index.php index.html;
    client_max_body_size 128M;

    location ~ /\.(?!well-known) {
        deny all;
    }

    location = /token.json {
        deny all;
    }

    location ~* ^/(application|system|vendor|google-client|biometric-bridge)(/|$) {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_pass unix:/run/php-fpm/www.sock;
    }

    location ~ \.php$ {
        deny all;
    }
}
