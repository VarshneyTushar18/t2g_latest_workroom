<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Workroom — temporary maintenance</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Segoe UI", system-ui, sans-serif;
            background: linear-gradient(145deg, #0f172a 0%, #141e46 45%, #1e293b 100%);
            color: #e2e8f0;
            padding: 24px;
        }
        .card {
            max-width: 480px;
            width: 100%;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 16px;
            padding: 36px 32px;
            text-align: center;
        }
        h1 { font-size: 22px; margin: 0 0 12px; color: #fff; }
        p { font-size: 15px; line-height: 1.55; color: #cbd5e1; margin: 0 0 20px; }
        a { color: #60a5fa; }
    </style>
</head>
<body>
    <div class="card">
        <h1>We&rsquo;ll be back shortly</h1>
        <p>Workroom is temporarily unavailable while we fix an issue. Please try again in a few minutes.</p>
        <p><a href="/admin/authentication">Return to login</a> &middot; <a href="javascript:location.reload()">Refresh</a></p>
    </div>
</body>
</html>
